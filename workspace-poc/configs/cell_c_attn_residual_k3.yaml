# Cell C with Attention Residual Core + Kimi K3 architectural updates
#
# Based on cell_c_attn_residual.yaml (AR backward bug fix included) with
# two additional Kimi K3-inspired improvements (kimi-k3-relevance-notes.md):
#
# §3 Short Convolution: depthwise causal conv1d (kernel=3) before QKV
#   projection in retention layers. Captures local token dependencies
#   — important for arithmetic where individual digit positions carry
#   critical information. Identity init (starts as no-op).
#
# §5 Per-Channel Decay: expands gamma from (n_heads,) to (n_heads, d_head)
#   for fine-grained per-channel memory decay. Different feature dimensions
#   can have different memory horizons (position features decay fast,
#   semantic features decay slow). Uses exp decomposition to avoid
#   materializing a (1, H, d_head, T, T) decay matrix.
#
# All other settings identical to cell_c_attn_residual.yaml.
cell: C
d_model: 384
n_layers: 13
n_heads: 4
use_attention: true
attention_positions: [5, 10]
use_workspace: true
n_workspace_slots: 16
recurrent_core: true
attention_residual_core: true
core_start: 6
core_end: 10
k_train_max: 6
k_inference: 6
spectral_norm_bound: 5.0
backbone_spectral_norm_bound: 2.0
freeze_gamma: true
ws_entropy_weight: 0.0
ws_diversity_weight: 0.0
gate_init: 0.0
slot_decay_init: 1.0

# Kimi K3 architectural updates
short_conv: true
short_conv_kernel: 3
per_channel_decay: true

# Training
lr: 2.0e-4
lr_groups:
  ws_read_gate: 10.0
  ws_write_gate: 10.0
  ws_read_qk_scale: 1.0
  ws_write_qk_scale: 1.0
  ws_ar_query: 1.0
  ws_ar_scale: 1.0
  ws_: 0.25
  "suffix:_gamma": 0.01
max_steps: 10000
tokens_per_batch: 50000
seq_len: 128
warmup_steps: 200
weight_decay: 0.1
grad_clip: 1.0
ws_grad_clip: 0.5
z_loss_coef: 1.0e-4
depth_range: [2, 8]
eval_interval: 500
log_interval: 50
checkpoint_interval: 100
seed: 42

# Early stopping
plateau_patience: 1000
plateau_min_delta: 1.0e-3

# TT-specific
use_gradient_checkpointing: false
tt_compile: false

micro_batch_size: 0

# Wandb
wandb: false
wandb_project: mamba-workspace-poc
run_name: cellC-tt-ar-k3

# Checkpointing
ckpt_dir: checkpoints
resume: false
