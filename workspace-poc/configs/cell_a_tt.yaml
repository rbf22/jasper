# Cell A on Tenstorrent Quietbox 2 — CONTROL for workspace comparison
# Retention + attention, no workspace, learning rate 2e-4.
#
# Renamed from the old "Cell E" (2026-07-31, once the pytorch-SSM
# cells A/B were deprecated and removed — see AGENTS.md).
#
# Comparison:
#   A vs B  → effect of workspace (same LR, A has no workspace, B does)
#   A vs C  → effect of workspace + recurrence (same LR)
cell: A
d_model: 384
n_layers: 14
n_heads: 4
use_attention: true
attention_positions: [5, 10]
use_workspace: false
recurrent_core: false

# Training — matches Cell B/C learning rate
lr: 2.0e-4
max_steps: 10000
tokens_per_batch: 50000
seq_len: 128
warmup_steps: 200
# Cosine LR decay: matches Cell B/C configs for fair comparison.
cosine_decay_steps: 8000
cosine_min_ratio: 0.1
weight_decay: 0.1
# Exclude ReZero gates from weight decay — matches Cell B/C configs.
wd_groups:
  "suffix:_gate": 0.0
# Per-parameter beta2 for backbone gates — matches Cell B/C configs.
beta2_groups:
  "suffix:_gate": 0.999
grad_clip: 1.0
spike_action: restore
z_loss_coef: 1.0e-4
depth_range: [2, 8]
eval_interval: 500
log_interval: 50
checkpoint_interval: 100
seed: 42

# Early stopping: with effective_batch=384 and EMA beta=0.99, the EMA
# averages over ~4800 micro-batches. min_delta=1e-3 (0.1%) is above the
# EMA noise floor so only real improvements reset the counter.
# patience=1000 is 10% of max_steps — generous for slow convergence.
plateau_patience: 1000
plateau_min_delta: 1.0e-3

# TT-specific: bf16 native, no gradient checkpointing (ample device DRAM)
use_gradient_checkpointing: false
tt_compile: false

# Larger micro-batch — QB2 has 249GB host RAM + ample device DRAM
micro_batch_size: 0

# Wandb
wandb: false
wandb_project: wrap-poc
run_name: cellA-tt-seed1

# Checkpointing — local only (no Google Drive on QB2)
ckpt_dir: checkpoints
resume: false
