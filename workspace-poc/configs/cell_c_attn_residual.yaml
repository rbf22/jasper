# Cell C with Attention Residual Core (Kimi K3 style)
# Replaces the fixed 1/sqrt(K) blend with learned softmax attention over
# iteration outputs. This bounds output magnitude (softmax normalizes) and
# gives consistent gradient magnitude across K iterations — directly
# addressing the gradient amplification that caused Cell C divergence
# at step ~1000 with the fixed blend.
#
# See kimi-k3-relevance-notes.md §2 for the design rationale.
# Based on Bachlechner et al., 2020 (ReZero) and Moonshot AI, 2026 (Kimi K3).
#
# The slot_state still chains normally through workspace calls. The 1/K
# slot gradient scaling is retained in backward to dampen the slot chain's
# multiplicative gradient path. The key improvement is that the x-path
# no longer has the multiplicative blend chain — each iteration receives
# gradient directly from the attention residual (bounded by softmax weights).
#
# Primary Cell C config — attention residual core + recurrent workspace.
# - attention_residual_core: true
# - ws_grad_clip: 0.5 (needed for slot chain)
cell: C
d_model: 384
n_layers: 13
n_heads: 4
use_attention: true
attention_positions: [5, 10]
use_workspace: true
n_workspace_slots: 16
recurrent_core: true
attention_residual_core: true
core_start: 6
core_end: 10
k_train_max: 6
k_inference: 6
spectral_norm_bound: 5.0
backbone_spectral_norm_bound: 2.0
# Chain gradient scaling safety factor. With ReZero backbone gates (gate=0
# at init), the per-iteration amplification A_coupled starts at ~1.0 and
# grows slowly as gates open. A/K = 1/6 = 0.17 at init — 83% margin. No
# extra safety factor needed.
chain_scale_safety: 1.0
freeze_gamma: true
# Freeze slot_decay at init (1.0 = no decay). The slot chain
# self-amplification is slot_decay + read_gate_path. If slot_decay grows
# above 1.0, the slot chain diverges. Freezing prevents this.
freeze_slot_decay: true
ws_entropy_weight: 0.0
ws_diversity_weight: 0.0
gate_init: 0.0
slot_decay_init: 1.0
# Clamp ReZero gates to [-0.3, 0.3] after each optimizer step.
# Cell C's gates are positive (read gate ~0.30 at step 1950), so the risk
# of RMSNorm cancellation is lower than Cell B. But this is a free safety
# net — positive gates are self-dampening (amplification makes RMS larger
# → 1/RMS smaller → gradient smaller), so clamping at 0.3 won't constrain
# normal learning. It only prevents a catastrophic regime shift if the
# dynamics change unexpectedly.
gate_clamp_bound: 0.3

# Training
lr: 2.0e-4
# Per-parameter LR groups: workspace gets 0.25x base LR.
# Gates get 10x base LR — matching Cell B's successful config. The 3x used
# in run 3 starved the workspace (gates only reached 0.10 vs Cell B's 0.66,
# loss plateaued at 1.36 vs Cell B's 0.035). Now that the optimizer bug is
# fixed and the AR is actually learning, it should compensate for faster
# gate growth.
# Attention residual params get 10x base LR — the AR must learn fast
# enough to down-weight unstable iterations before gates open. With
# scale init=1.0 (not 1/sqrt(D)), the softmax has real gradient signal.
lr_groups:
  ws_read_gate: 10.0
  ws_write_gate: 10.0
  ws_read_qk_scale: 1.0
  ws_write_qk_scale: 1.0
  ws_ar_query: 10.0
  ws_ar_scale: 10.0
  ws_: 0.25
  "suffix:_gamma": 0.01
max_steps: 10000
tokens_per_batch: 50000
seq_len: 128
warmup_steps: 200
# Cosine LR decay: after warmup, decay from base_lr to 10% over 8000 steps.
# Cell C diverged at step 2100 with constant LR — a bifurcation where the
# model oscillates past a stability cliff. Cosine decay shrinks step size
# as the model converges, preventing the bifurcation.
cosine_decay_steps: 8000
cosine_min_ratio: 0.1
weight_decay: 0.1
# Exclude ReZero gates from weight decay. Gates are scalar parameters meant
# to grow from 0 — weight decay pulls them back, fighting gradient-driven growth.
wd_groups:
  "suffix:_gate": 0.0
# Per-parameter beta2: backbone ReZero gates use 0.999 (vs 0.95 default).
# Gate gradients have extreme variance (1568x max/min ratio per diagnostic)
# because grad_gate = sum(grad_out * inner_output). With beta2=0.95, a single
# spike dominates v_hat and destabilizes the update. beta2=0.999 averages
# ~1000 steps for stable normalization.
beta2_groups:
  "suffix:_gate": 0.999
grad_clip: 1.0
# Component-wise gradient clipping: workspace params clipped at 0.5,
# backbone at grad_clip (1.0). Still needed for the slot chain.
ws_grad_clip: 0.5
# Restore-on-spike: when grad norm exceeds threshold (default 5000), reload
# the last checkpoint instead of skipping the step. Skip-on-spike freezes the
# model in the bad state that caused the spike — it can never recover. Restore
# gives it a fresh start from a known-good state (at most 100 steps old).
spike_action: restore
z_loss_coef: 1.0e-4
depth_range: [2, 8]
eval_interval: 500
log_interval: 50
checkpoint_interval: 100
seed: 42

# Early stopping
plateau_patience: 1000
plateau_min_delta: 1.0e-3

# TT-specific
use_gradient_checkpointing: false
tt_compile: false

micro_batch_size: 0

# Wandb
wandb: false
wandb_project: wrap-poc
run_name: cellC-tt-attn-residual

# Checkpointing
ckpt_dir: checkpoints
resume: false
