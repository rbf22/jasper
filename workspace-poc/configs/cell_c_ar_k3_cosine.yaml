# Cell C with Attention Residual Core (Kimi K3 style)
# Replaces the fixed 1/sqrt(K) blend with learned softmax attention over
# iteration outputs. This bounds output magnitude (softmax normalizes) and
# gives consistent gradient magnitude across K iterations — directly
# addressing the gradient amplification that caused Cell C divergence
# at step ~1000 with the fixed blend.
#
# See kimi-k3-relevance-notes.md §2 for the design rationale.
# Based on Bachlechner et al., 2020 (ReZero) and Moonshot AI, 2026 (Kimi K3).
#
# The slot_state still chains normally through workspace calls. The 1/K
# slot gradient scaling is retained in backward to dampen the slot chain's
# multiplicative gradient path. The key improvement is that the x-path
# no longer has the multiplicative blend chain — each iteration receives
# gradient directly from the attention residual (bounded by softmax weights).
#
# Differences from cell_c_tt.yaml:
# - attention_residual_core: true (new)
# - ws_grad_clip: 0.5 (kept — still needed for slot chain)
# - Everything else identical to cell_c_tt.yaml
cell: C
d_model: 384
n_layers: 13
n_heads: 4
use_attention: true
attention_positions: [5, 10]
use_workspace: true
n_workspace_slots: 16
recurrent_core: true
attention_residual_core: true
core_start: 6
core_end: 10
k_train_max: 3
k_inference: 3
spectral_norm_bound: 5.0
backbone_spectral_norm_bound: 2.0
# Chain gradient scaling safety factor. With ReZero backbone gates (gate=0
# at init), the per-iteration amplification A_coupled starts at ~1.0 and
# grows slowly as gates open. A/K = 1/6 = 0.17 at init — 83% margin. No
# extra safety factor needed.
chain_scale_safety: 1.0
freeze_gamma: true
# Freeze slot_decay at init (1.0 = no decay). The slot chain
# self-amplification is slot_decay + read_gate_path. If slot_decay grows
# above 1.0, the slot chain diverges. Freezing prevents this.
freeze_slot_decay: true
ws_entropy_weight: 0.0
ws_diversity_weight: 0.0
gate_init: 0.0
slot_decay_init: 1.0

# Training
lr: 2.0e-4
# Per-parameter LR groups: workspace gets 0.25x base LR.
# Gates get 10x base LR (same as run 4 — read gate was healthy at 0.64).
# K reduced from 6 to 3 to reduce dilution: effective workspace contribution
# is rg/K = 0.64/3 = 0.21 vs 0.64/6 = 0.107 with K=6. This is 2x stronger
# and closer to Cell B's single-pass 0.66. Fewer iterations also means each
# one matters more, giving the AR more signal to differentiate.
# Attention residual params get 10x base LR.
#
# Cosine LR schedule: K3 run converged at step ~3400 but gates kept growing
# past the stability threshold (rg~0.70, wg~-0.37) and diverged at step 4700.
# Cosine decay over 5000 steps brings gate LR to ~10% of peak by step 5200,
# preventing the feedback loop that causes unbounded gate growth.
lr_groups:
  ws_read_gate: 10.0
  ws_write_gate: 10.0
  ws_read_qk_scale: 1.0
  ws_write_qk_scale: 1.0
  ws_ar_query: 10.0
  ws_ar_scale: 10.0
  ws_: 0.25
  "suffix:_gamma": 0.01
max_steps: 10000
tokens_per_batch: 50000
seq_len: 128
warmup_steps: 200
weight_decay: 0.1
# Cosine LR schedule: decay LR from base to base*0.1 over 5000 steps after warmup.
# K3 converged at step 3400; by step 5200 (where divergence occurred in the
# previous K3 run), gate LR will be ~10% of peak, preventing the feedback loop.
cosine_decay_steps: 5000
cosine_min_ratio: 0.1
grad_clip: 1.0
# Component-wise gradient clipping: workspace params clipped at 0.5,
# backbone at grad_clip (1.0). Still needed for the slot chain.
ws_grad_clip: 0.5
z_loss_coef: 1.0e-4
depth_range: [2, 8]
eval_interval: 500
log_interval: 50
checkpoint_interval: 100
seed: 42

# Early stopping
plateau_patience: 3000
plateau_min_delta: 1.0e-3

# TT-specific
use_gradient_checkpointing: false
tt_compile: false

micro_batch_size: 0

# Wandb
wandb: false
wandb_project: mamba-workspace-poc
run_name: cellC-tt-attn-residual

# Checkpointing
ckpt_dir: checkpoints
resume: false
