# Cell B on Tenstorrent Quietbox 2 — hybrid + workspace (perceiver)
# Blackhole bfloat16-native, single chip, no fp16 AMP / GradScaler needed
#
# Renamed from the old "Cell C" (2026-07-31, once the pytorch-Mamba2
# cells A/B were deprecated and removed — see AGENTS.md).
#
# Architecture v2 (2026-08-02): QK-Norm + ReZero gates + component-wise clipping
# - QK Normalization on workspace cross-attention (bounds logits, prevents
#   entropy collapse — Henry et al. 2020, now standard in OLMo 2 / Gemma 3)
# - ReZero gates (scalar, init=0, no sigmoid — Bachlechner et al. 2020)
# - Component-wise gradient clipping: workspace clipped at ws_grad_clip,
#   backbone at grad_clip (Yang et al. 2022)
cell: B
d_model: 384
n_layers: 13
n_heads: 4
use_attention: true
attention_positions: [5, 10]
use_workspace: true
n_workspace_slots: 16
recurrent_core: false
spectral_norm_bound: 5.0
backbone_spectral_norm_bound: 2.0
freeze_gamma: true
# Attention entropy/diversity regularizers: DISABLED.
# Measured harmful. With weight 0.01 the B run reached answer-token loss 0.55
# (best ever) but evaluated at 11.7% overall / 25% Task 2 — vs 33% / 85% for the
# same architecture WITHOUT regularizers, and 62% / 80% for the no-workspace
# control. Predictions mode-collapsed to a near-constant answer ("18"/"19").
# Cause: entropy measures peakedness, not input-dependence. The cheapest
# low-entropy solution is a FIXED routing that ignores the input, which is
# exactly what the regularizer selected for. Do not re-enable without an
# input-dependence metric (see diagnose_workspace.py).
ws_entropy_weight: 0.0
ws_diversity_weight: 0.0
# gate_init is no longer used — ReZero gates start at 0.0 (hardcoded).
# Kept for backward compatibility with checkpoint loading.
gate_init: 0.0
slot_decay_init: 1.0
# Freeze slot_decay at init (1.0 = no decay). Matches Cell C — prevents
# slot_decay from drifting and destabilizing the slot update. Cell B
# previously allowed it to learn (drifted to 0.98), but the drift is an
# unnecessary degree of freedom that adds risk without benefit.
freeze_slot_decay: true
# Clamp ReZero gates to [-0.3, 0.3] after each optimizer step.
# With causal masking, the workspace's past-only contribution is noise for
# Cell B (no recurrent core), so the model suppresses it → gates grow negative.
# At -0.43, the pre-norm residual `decay * slots + gate * read_out` cancels,
# making RMS very small. RMSNorm backward divides by RMS, amplifying the
# gradient by 1/RMS → gradient explosion at step ~2100.
# The pre-causal-fix run had gates in [-0.35, 0.43] and was stable, so ±0.3
# is a safe bound that doesn't constrain normal learning.
gate_clamp_bound: 0.3

# Training
lr: 2.0e-4
# Per-parameter LR groups: workspace gets 0.25x base LR (5e-5) to prevent
# gradient explosion at warmup peak. Gates get 3x base LR (6e-4) so they
# open fast enough to contribute within the training budget.
# Reduced from 10x to 3x on 2026-08-09: with causal masking, the workspace's
# past-only contribution is noise for Cell B (no recurrent core), so the model
# suppresses it → gates grow negative. At 10x LR, gates reached -0.43 by step
# 2100, causing RMSNorm cancellation and gradient explosion. 3x gives more
# time to learn before hitting the clamp bound.
lr_groups:
  ws_read_gate: 3.0
  ws_write_gate: 3.0
  ws_read_qk_scale: 1.0
  ws_write_qk_scale: 1.0
  ws_: 0.25
  # Retention gamma is frozen (freeze_gamma: true) — the O(T^2) gamma gradient
  # is structurally unstable with the workspace.  Gamma barely moves during
  # training (drift < 0.03 from init), so freezing it at ~0.95 loses nothing
  # while eliminating the gradient explosion.  The LR group below is a no-op
  # when gamma is frozen, kept for documentation.
  "suffix:_gamma": 0.01
max_steps: 10000
tokens_per_batch: 50000
seq_len: 128
warmup_steps: 200
# Cosine LR decay: after warmup, decay from base_lr to 10% over 8000 steps.
# Without decay, the constant LR keeps oscillation amplitude fixed even as the
# model converges, eventually pushing past a stability cliff (observed at step
# 650 for Cell B). Cosine decay shrinks the step size as the model approaches
# the minimum, preventing the bifurcation.
cosine_decay_steps: 8000
cosine_min_ratio: 0.1
weight_decay: 0.1
# Exclude ReZero gates from weight decay.  Weight decay pulls gates toward 0,
# fighting their gradient-driven growth.  Gates are scalar parameters meant to
# grow from 0 — applying weight decay to them is like applying it to a bias.
wd_groups:
  "suffix:_gate": 0.0
# Per-parameter beta2: backbone ReZero gates use 0.999 (vs 0.95 default).
# Gate gradients have extreme variance (8677x max/min ratio per diagnostic)
# because grad_gate = sum(grad_out * inner_output) — a dot product that is
# near-zero when grad_out and inner are orthogonal and large when they align.
# With beta2=0.95, AdamW's v_hat only averages ~20 steps, so a single spike
# dominates the normalization and destabilizes the update.  beta2=0.999
# averages ~1000 steps, providing stable normalization despite the variance.
beta2_groups:
  "suffix:_gate": 0.999
grad_clip: 1.0
# Component-wise gradient clipping: workspace params clipped at 0.5,
# backbone at grad_clip (1.0). Prevents workspace gradient spikes from
# dominating the global clip and starving the backbone of learning signal.
ws_grad_clip: 0.5
# Restore-on-spike: when grad norm exceeds threshold (default 5000), reload
# the last checkpoint instead of skipping the step. Skip-on-spike freezes the
# model in the bad state that caused the spike — it can never recover. Restore
# gives it a fresh start from a known-good state (at most 100 steps old).
spike_action: restore
z_loss_coef: 1.0e-4
depth_range: [2, 8]
eval_interval: 500
log_interval: 50
checkpoint_interval: 100
seed: 42

# Early stopping: see cell_a_tt.yaml for rationale.
plateau_patience: 1000
plateau_min_delta: 1.0e-3

# TT-specific: bf16 native, no gradient checkpointing (ample device DRAM)
use_gradient_checkpointing: false
tt_compile: false

# Larger micro-batch — QB2 has 249GB host RAM + ample device DRAM
micro_batch_size: 0

# Wandb
wandb: false
wandb_project: mamba-workspace-poc
run_name: cellB-tt-qknorm-rezero

# Checkpointing — local only (no Google Drive on QB2)
ckpt_dir: checkpoints
resume: false
