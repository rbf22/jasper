# Cell A on Tenstorrent Quietbox 2 — pure Mamba2 (SSM floor)
# Blackhole bfloat16-native, single chip, no fp16 AMP / GradScaler needed
cell: A
d_model: 384
n_layers: 14
expand: 4
d_state: 64
n_heads: 4
use_attention: false
use_workspace: false
recurrent_core: false

# Training
lr: 6.0e-4
max_steps: 10000
tokens_per_batch: 250000
seq_len: 128
warmup_steps: 200
weight_decay: 0.1
grad_clip: 1.0
z_loss_coef: 1.0e-4
depth_range: [2, 8]
eval_interval: 500
log_interval: 50
checkpoint_interval: 100
seed: 42

# TT-specific: bf16 native, no gradient checkpointing (ample device DRAM)
use_gradient_checkpointing: false
tt_compile: false

# Larger micro-batch — QB2 has 249GB host RAM + ample device DRAM
# No grad accumulation needed at this scale
micro_batch_size: 0

# Wandb
wandb: false
wandb_project: mamba-workspace-poc
run_name: cellA-tt-seed1

# Checkpointing — local only (no Google Drive on QB2)
ckpt_dir: checkpoints
resume: true
