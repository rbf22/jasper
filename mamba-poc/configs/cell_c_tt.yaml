# Cell C on Tenstorrent Quietbox 2 — hybrid + workspace (perceiver)
# Blackhole bfloat16-native, single chip, no fp16 AMP / GradScaler needed
cell: C
d_model: 384
n_layers: 13
expand: 4
d_state: 64
n_heads: 4
use_attention: true
attention_positions: [5, 10]
use_workspace: true
n_workspace_slots: 16
recurrent_core: false
spectral_norm_bound: 5.0

# Training
lr: 2.0e-4
# Per-parameter LR groups: workspace gets 0.25x base LR (5e-5) to prevent
# gradient explosion at warmup peak. Backbone stays at 2e-4 to match Cell E.
lr_groups:
  ws_: 0.25
max_steps: 10000
tokens_per_batch: 250000
seq_len: 128
warmup_steps: 200
weight_decay: 0.1
grad_clip: 1.0
z_loss_coef: 1.0e-4
depth_range: [2, 8]
eval_interval: 500
log_interval: 50
checkpoint_interval: 100
seed: 42

# TT-specific: bf16 native, no gradient checkpointing (ample device DRAM)
use_gradient_checkpointing: false
tt_compile: false

# Larger micro-batch — QB2 has 249GB host RAM + ample device DRAM
micro_batch_size: 0

# Wandb
wandb: false
wandb_project: mamba-workspace-poc
run_name: cellC-tt-seed1

# Checkpointing — local only (no Google Drive on QB2)
ckpt_dir: checkpoints
resume: true
