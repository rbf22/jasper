# Cell E on Tenstorrent Quietbox 2 — CONTROL for workspace comparison
# Identical architecture to Cell B (Mamba2 + attention, no workspace)
# but with Cell C/D's learning rate (2e-4) to isolate the workspace effect
# from the learning rate effect.
#
# Comparison:
#   B vs E  → effect of learning rate (same architecture, different LR)
#   E vs C  → effect of workspace (same LR, E has no workspace, C does)
#   E vs D  → effect of workspace + recurrence (same LR)
cell: E
d_model: 384
n_layers: 14
expand: 4
d_state: 64
n_heads: 4
use_attention: true
attention_positions: [5, 10]
use_workspace: false
recurrent_core: false

# Training — matches Cell C/D learning rate
lr: 2.0e-4
max_steps: 10000
tokens_per_batch: 250000
seq_len: 128
warmup_steps: 200
weight_decay: 0.1
grad_clip: 1.0
z_loss_coef: 1.0e-4
depth_range: [2, 8]
eval_interval: 500
log_interval: 50
checkpoint_interval: 25
seed: 42

# TT-specific: bf16 native, no gradient checkpointing (ample device DRAM)
use_gradient_checkpointing: false
tt_compile: false

# Larger micro-batch — QB2 has 249GB host RAM + ample device DRAM
micro_batch_size: 0

# Wandb
wandb: false
wandb_project: mamba-workspace-poc
run_name: cellE-tt-seed1

# Checkpointing — local only (no Google Drive on QB2)
ckpt_dir: checkpoints
resume: true
