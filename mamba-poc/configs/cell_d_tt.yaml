# Cell D on Tenstorrent Quietbox 2 — full architecture (hybrid + workspace + recurrent core)
# Blackhole bfloat16-native, single chip, no fp16 AMP / GradScaler needed
# K_max padding: recurrent core always loops k_train_max=6 times (static for XLA),
# iterations beyond sampled K are masked to identity via blend.
cell: D
d_model: 384
n_layers: 13
expand: 4
d_state: 64
n_heads: 4
use_attention: true
attention_positions: [5, 10]
use_workspace: true
n_workspace_slots: 16
recurrent_core: true
core_start: 6
core_end: 10
k_train_max: 6
k_inference: 6
spectral_norm_bound: 5.0

# Training
lr: 2.0e-4
# Per-parameter LR groups: workspace gets 0.25x base LR (5e-5) to prevent
# gradient explosion at warmup peak. Backbone stays at 2e-4 to match Cell E.
lr_groups:
  ws_: 0.25
max_steps: 10000
tokens_per_batch: 250000
seq_len: 128
warmup_steps: 200
weight_decay: 0.1
grad_clip: 1.0
z_loss_coef: 1.0e-4
depth_range: [2, 8]
eval_interval: 500
log_interval: 50
checkpoint_interval: 100
seed: 42

# TT-specific: bf16 native, no gradient checkpointing (ample device DRAM)
use_gradient_checkpointing: false
tt_compile: false

# Larger micro-batch — QB2 has 249GB host RAM + ample device DRAM
# Cell D uses more memory (workspace + recurrent core with K_max padding)
# but Blackhole DRAM can handle it without gradient checkpointing
micro_batch_size: 0

# Wandb
wandb: false
wandb_project: mamba-workspace-poc
run_name: cellD-tt-seed1

# Checkpointing — local only (no Google Drive on QB2)
ckpt_dir: checkpoints
resume: true
