# Text MVP — Cell C with Attention Residual Core on narrative logic puzzles.
#
# Same architecture as text_cell_c.yaml, but trained on synthetic multi-hop
# puzzles (location tracking, object moves, arithmetic chains, swaps, and
# attribute recall). Each line is a self-contained story that ends with a
# question and its answer, so the model must keep state in the workspace to
# predict the final sentence correctly.

cell: text
d_model: 384
n_layers: 13
n_heads: 4
vocab_size: 50257
use_attention: true
attention_positions: [5, 10]
use_workspace: true
n_workspace_slots: 16
recurrent_core: true
attention_residual_core: true
core_start: 6
core_end: 10
k_train_max: 6
k_inference: 6
spectral_norm_bound: 5.0
backbone_spectral_norm_bound: 2.0
chain_scale_safety: 1.0
freeze_gamma: true
freeze_slot_decay: true
ws_entropy_weight: 0.0
ws_diversity_weight: 0.0
gate_init: 0.0
slot_decay_init: 1.0
gate_clamp_bound: 0.3

# Training
lr: 1.0e-4
lr_groups:
  ws_read_gate: 10.0
  ws_write_gate: 10.0
  ws_read_qk_scale: 1.0
  ws_write_qk_scale: 1.0
  ws_ar_query: 1.0
  ws_ar_scale: 1.0
  ws_: 0.25
  "suffix:_gamma": 0.01
# The logic-puzzle dataset is ~23M tokens, so fewer steps than TinyStories.
# 1000 steps with an effective batch of ~384 x 512 = ~200k tokens/step
# gives ~200M training tokens (about 8 epochs over the full set).
max_steps: 1000
tokens_per_batch: 50000
seq_len: 512
warmup_steps: 100
cosine_decay_steps: 800
cosine_min_ratio: 0.1
weight_decay: 0.1
wd_groups:
  "suffix:_gate": 0.0
beta2_groups:
  "suffix:_gate": 0.999
grad_clip: 1.0
ws_grad_clip: 0.5
spike_action: restore
z_loss_coef: 1.0e-4
eval_interval: 100
log_interval: 20
checkpoint_interval: 200
seed: 42

# Early stopping
plateau_patience: 300
plateau_min_delta: 1.0e-3

# Data
train_data: data/logic_puzzles_train.txt
valid_data: data/logic_puzzles_valid.txt
max_train_tokens: null
eval_batches: 10

# TT-specific
use_gradient_checkpointing: false
tt_compile: false

micro_batch_size: 0  # auto-compute
accum_steps: 0       # auto-compute

# Wandb
wandb: false
wandb_project: wrap-text
run_name: text-cell-c-logic

# Checkpointing
ckpt_dir: checkpoints
resume: false
