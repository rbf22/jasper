# Pytest configuration for Jasper project — CPU-only tests
#
# Only collects pytest-compatible test files (test_data.py, test_text_data.py).
# Standalone scripts that require TT hardware (test_retention_parity.py, etc.)
# are excluded — they have their own pass/fail logic and are run separately.
#
# Usage:
#   .tt-venv/bin/python -m pytest -v
#   .tt-venv/bin/python -m pytest workspace-poc/test_data.py -v
#   .tt-venv/bin/python -m pytest -k task1 -v

[pytest]
testpaths =
    workspace-poc/test_data.py
    workspace-mvp/test_text_data.py
norecursedirs = .git checkpoints logs generated data __pycache__ kernels
addopts = -v
